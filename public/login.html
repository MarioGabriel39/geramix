<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeraMix - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  
</script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #555;
      background: #222;
      color: white;
    }

    button {
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>GeraMix</h1>
    <p>Acesso restrito</p>

    <form novalidate>
      <input type="email" placeholder="E-mail" required>

      <input type="password" placeholder="Senha" required>

      <button type="submit">Entrar</button>

      <button type="button" onclick="window.location.href='/cadastro.html'">
        Criar conta
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://xbhztvjdzqpsdjtwmpys.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_1QZy7zvLfCrUjSS2fZGWaQ_8svC39fb';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alert('O botão Entrar está funcionando');

      const email = document.querySelector('input[type="email"]').value;
      const senha = document.querySelector('input[type="password"]').value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (error) {
        alert(error.message);
        return;
      }

      window.location.href = '/';
    });
  </script>

</body>
</html>
