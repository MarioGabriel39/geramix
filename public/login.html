<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeraMix - Login</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111;
      color:#fff;
      font-family:Arial,sans-serif;
    }
    .login{
      width:90%;
      max-width:380px;
      background:#1c1c24;
      padding:28px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.4);
    }
    h1{
      text-align:center;
      margin:0 0 8px;
    }
    p{
      text-align:center;
      color:#999;
      margin:0 0 24px;
    }
    input,button{
      width:100%;
      padding:14px;
      margin-top:12px;
      border-radius:12px;
      font-size:16px;
    }
    input{
      border:1px solid #333;
      background:#292934;
      color:#fff;
    }
    button{
      border:0;
      background:#fff;
      color:#111;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="login">
    <h1>GeraMix</h1>
    <p>Acesso restrito</p>

    <form>
      <input type="text" placeholder="Usuário" required>
      <input type="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
