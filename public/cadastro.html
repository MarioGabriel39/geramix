<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeraMix - Criar conta</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111;
      color:#fff;
      font-family:Arial,sans-serif;
    }
    .box{
      width:90%;
      max-width:380px;
      background:#1c1c24;
      padding:28px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.4);
    }
    h1{text-align:center;margin:0 0 8px}
    p{text-align:center;color:#999;margin:0 0 24px}
    input,button{
      width:100%;
      padding:14px;
      margin-top:12px;
      border-radius:12px;
      font-size:16px;
    }
    input{
      border:1px solid #333;
      background:#292934;
      color:#fff;
    }
    button{
      border:0;
      background:#fff;
      color:#111;
      font-weight:bold;
    }
    .voltar{
      display:block;
      text-align:center;
      margin-top:18px;
      color:#aaa;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Criar conta</h1>
    <p>Crie seu acesso ao GeraMix</p>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <form>
      <input type="text" placeholder="Usuário" required>
      <input type="email" placeholder="E-mail" required>
      <input type="password" placeholder="Senha" required>
      <input type="password" placeholder="Confirmar senha" required>
      <button type="submit">Criar conta</button>
    </form>

    <a class="voltar" href="/login.html">Voltar para entrar</a>
  </div>
</body>
</html>
