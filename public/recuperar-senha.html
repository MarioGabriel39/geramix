<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeraMix - Recuperar senha</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #555;
      background: #222;
      color: white;
    }

    button {
      border: none;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .mensagem {
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>GeraMix</h1>

    <p>
      Digite seu e-mail e enviaremos um link para você criar uma nova senha.
    </p>

    <form id="formRecuperacao">

      <input
        type="email"
        id="email"
        placeholder="E-mail"
        required
      >

      <button type="submit" id="botao">
        Enviar link
      </button>

    </form>

    <div class="mensagem" id="mensagem"></div>

    <a class="voltar" href="/login.html">
      Voltar para o login
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      'https://xbhztvjdzqpsdjtwmpys.supabase.co';

    const SUPABASE_ANON_KEY =
      'SUA_PUBLISHABLE_KEY_AQUI';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById('formRecuperacao');
    const emailInput = document.getElementById('email');
    const botao = document.getElementById('botao');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        mensagem.textContent = 'Digite seu e-mail.';
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Enviando...';
      mensagem.textContent = '';

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo:
            window.location.origin + '/redefinir-senha.html'
        });

      if (error) {
        mensagem.textContent = error.message;
        botao.disabled = false;
        botao.textContent = 'Enviar link';
        return;
      }

      mensagem.textContent =
        'Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.';

      botao.disabled = false;
      botao.textContent = 'Link enviado';
    });
  </script>

</body>
</html>
