<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeraMix</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#171717;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 50px;
}
h1{margin:0 0 6px;font-size:30px}
.subtitle{color:#666;margin-bottom:22px}
.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #00000012;
}
.card h2{
  margin:0 0 12px;
  font-size:18px;
}
input[type=file]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}
.count{
  margin-top:9px;
  color:#666;
  font-size:14px;
}
.total{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}
button,.download{
  display:inline-block;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  background:#111;
  color:white;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.progress{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.bar{
  height:100%;
  width:0%;
  background:#111;
  transition:.3s;
}
.status{
  font-size:14px;
  color:#555;
}
.video-card{
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}
.video-card video{
  width:100%;
  max-height:500px;
  background:#000;
  border-radius:10px;
}
.video-title{
  font-weight:bold;
  margin:10px 0 5px;
}
.info{
  font-size:13px;
  color:#666;
  line-height:1.5;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  border-radius:8px;
  background:#eef7ee;
  color:#256025;
  font-size:12px;
  font-weight:bold;
}
.hidden{display:none}
.error{
  color:#b00020;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎬 GeraMix</h1>
  <div class="subtitle">
    Multiplicador de vídeos — Hook + Corpo + CTA
  </div>

  <div class="card">
    <h2>1️⃣ Hooks / Ganchos</h2>
    <input id="hooks" type="file" accept="video/*" multiple>
    <div id="hooksCount" class="count">0 vídeos</div>
  </div>

  <div class="card">
    <h2>2️⃣ Corpos</h2>
    <input id="bodies" type="file" accept="video/*" multiple>
    <div id="bodiesCount" class="count">0 vídeos</div>
  </div>

  <div class="card">
    <h2>3️⃣ CTAs</h2>
    <input id="ctas" type="file" accept="video/*" multiple>
    <div id="ctasCount" class="count">0 vídeos</div>
  </div>

  <div class="card">
    <div class="total">
      Combinações: <span id="total">0</span>
    </div>

    <button id="generate">
      🚀 Gerar vídeos
    </button>
  </div>

  <div id="processing" class="card hidden">
    <h2>⚙️ Processando</h2>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <div id="status" class="status">
      Preparando...
    </div>
  </div>

  <div id="result" class="card hidden">

    <h2>✅ Vídeos gerados</h2>

    <a id="zip" class="download" href="#" download>
      ⬇️ Baixar todos em ZIP
    </a>

    <div id="videos"></div>

  </div>

  <div id="error" class="card error hidden"></div>

</div>

<script>

const hooksInput = document.getElementById("hooks");
const bodiesInput = document.getElementById("bodies");
const ctasInput = document.getElementById("ctas");

const hooksCount = document.getElementById("hooksCount");
const bodiesCount = document.getElementById("bodiesCount");
const ctasCount = document.getElementById("ctasCount");

const total = document.getElementById("total");
const generate = document.getElementById("generate");

const processing = document.getElementById("processing");
const bar = document.getElementById("bar");
const status = document.getElementById("status");

const result = document.getElementById("result");
const zip = document.getElementById("zip");
const videos = document.getElementById("videos");

const errorBox = document.getElementById("error");

function update(){

  const h = hooksInput.files.length;
  const b = bodiesInput.files.length;
  const c = ctasInput.files.length;

  hooksCount.textContent = h + (h === 1 ? " vídeo" : " vídeos");
  bodiesCount.textContent = b + (b === 1 ? " vídeo" : " vídeos");
  ctasCount.textContent = c + (c === 1 ? " vídeo" : " vídeos");

  total.textContent = h * b * c;
}

hooksInput.addEventListener("change",update);
bodiesInput.addEventListener("change",update);
ctasInput.addEventListener("change",update);

function showError(message){

  errorBox.textContent = message;
  errorBox.classList.remove("hidden");

}

async function createJob(){

  errorBox.classList.add("hidden");
